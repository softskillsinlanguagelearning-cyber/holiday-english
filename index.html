<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#35A7DF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SKILLS">
<title>SKILLS · Holiday English</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Angličtina na prázdniny – slovíčka, fráze a hry.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{
  --blue:#35A7DF; --yellow:#E5AF17; --grey:#676766; --green:#68BB8A; --red:#E0645C;
  --bg:#F3F8FC; --surface:#FFFFFF; --surface2:#EAF4FA; --text:#262A2D; --muted:#676766; --line:#D9E6EE;
  --shadow:0 3px 0 rgba(0,0,0,.08), 0 8px 24px rgba(30,60,90,.08);
  --radius:18px;
}
:root[data-theme="dark"]{
  --bg:#11171C; --surface:#1B232A; --surface2:#223039; --text:#EEF2F4; --muted:#A9B1B6; --line:#2E3B44;
  --shadow:0 3px 0 rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:16px}
body{min-height:100vh;transition:background .25s,color .25s}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:none;background:none}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:env(safe-area-inset-bottom)}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg)}
.logo-badge{background:#fff;border-radius:14px;padding:5px 10px;display:flex;align-items:center;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.logo-badge img{height:34px;display:block}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:8px 12px;font-weight:bold;box-shadow:var(--shadow)}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);font-size:20px;display:flex;align-items:center;justify-content:center}
.iconbtn:active{transform:translateY(2px)}

/* home */
.hero{padding:6px 18px 0}
.hero h1{margin:4px 0 2px;font-size:26px}
.hero p{margin:0;color:var(--muted)}
.map{position:relative;margin:10px 0 0}
.map svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node{position:absolute;transform:translate(-50%,0);width:150px;text-align:center}
.node .disc{width:78px;height:78px;margin:0 auto;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:36px;border:5px solid var(--line);box-shadow:var(--shadow);position:relative;transition:transform .15s}
.node .disc:active{transform:scale(.95)}
.node.done .disc{border-color:var(--green)}
.node.current .disc{border-color:var(--blue);animation:pulse 1.8s infinite}
.node.soon .disc{opacity:.5;filter:grayscale(1)}
.node .num{position:absolute;top:-6px;left:-6px;background:var(--yellow);color:#262A2D;font-weight:bold;font-size:13px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.node .lbl{margin-top:6px;font-weight:bold;font-size:14px;line-height:1.2;background:var(--bg);display:inline-block;padding:2px 6px;border-radius:8px}
.node .sub{font-size:12px;color:var(--muted);background:var(--bg);display:table;margin:0 auto;padding:0 6px;border-radius:8px}
.runner{position:absolute;width:64px;transition:left .6s,top .6s;animation:bob .5s infinite alternate;pointer-events:none;z-index:3}
:root[data-theme="dark"] .runner{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 1px #fff)}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(53,167,223,.5)}70%{box-shadow:0 0 0 14px rgba(53,167,223,0)}100%{box-shadow:0 0 0 0 rgba(53,167,223,0)}}
.bigbtn{display:block;width:calc(100% - 36px);margin:16px 18px;padding:16px;border-radius:16px;background:var(--yellow);color:#262A2D;font-weight:bold;font-size:18px;box-shadow:0 4px 0 #B8890C}
.bigbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #B8890C}
.bigbtn.blue{background:var(--blue);color:#fff;box-shadow:0 4px 0 #1E7FAE}
.bigbtn.green{background:var(--green);color:#fff;box-shadow:0 4px 0 #3F8E60}
.bigbtn.ghost{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.bigbtn:disabled{opacity:.45}

/* level page */
.lvhead{padding:4px 18px 8px}
.lvhead .tag{display:inline-block;background:var(--blue);color:#fff;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:bold}
.lvhead h2{margin:8px 0 2px;font-size:24px}
.lvhead .cz{color:var(--muted);margin:0}
.lvhead .intro{margin:10px 0 0}
.acts{display:flex;flex-direction:column;gap:12px;padding:8px 18px 24px}
.act{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);text-align:left;width:100%}
.act:active{transform:translateY(2px)}
.act .ic{width:52px;height:52px;border-radius:14px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.act .nm{font-weight:bold;font-size:17px}
.act .meta{color:var(--muted);font-size:13px;margin-top:3px}
.stars{color:var(--yellow);letter-spacing:1px;font-size:15px}
.stars .off{color:var(--line)}

/* activity shell */
.shell{display:flex;flex-direction:column;min-height:100vh}
.shellbar{display:flex;align-items:center;gap:10px;padding:10px 14px;position:sticky;top:0;background:var(--bg);z-index:10}
.prog{flex:1;height:14px;background:var(--line);border-radius:999px;overflow:hidden}
.prog>div{height:100%;width:0;background:var(--green);border-radius:999px;transition:width .3s}
.prog.timer>div{background:var(--blue)}
.prog.timer.low>div{background:var(--red)}
.hud{font-weight:bold;min-width:56px;text-align:right}
.body{flex:1;padding:6px 18px 120px}
.introcard{background:var(--surface);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);text-align:center;margin-top:16px}
.introcard .big{font-size:64px}
.introcard h3{margin:8px 0;font-size:22px}
.introcard p{color:var(--muted);line-height:1.45}

/* quiz */
.prompt{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;text-align:center;margin:12px 0 16px;position:relative}
.prompt .em{font-size:64px;line-height:1.1}
.prompt .q{font-size:22px;font-weight:bold;margin-top:6px}
.prompt .qs{color:var(--muted);margin-top:6px}
.say{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:var(--blue);color:#fff;border-radius:999px;padding:10px 16px;font-weight:bold}
.say.slow{background:var(--surface2);color:var(--text)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts.list{grid-template-columns:1fr}
.opt{background:var(--surface);border:3px solid var(--line);border-radius:16px;padding:16px 10px;font-size:20px;font-weight:bold;min-height:64px;box-shadow:0 3px 0 var(--line);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;text-align:center}
.opts.list .opt{font-size:17px;justify-content:flex-start;text-align:left;align-items:flex-start;padding:14px 16px}
.opt:active{transform:translateY(2px)}
.opt.good{border-color:var(--green);background:rgba(104,187,138,.18)}
.opt.bad{border-color:var(--red);opacity:.55;animation:shake .35s}
.opt .emo{font-size:44px;line-height:1}
.opt .small{font-size:13px;color:var(--muted);font-weight:normal}
.opt.tag{font-family:Arial;font-size:22px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* toast */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(140%);width:min(440px,calc(100% - 28px));background:var(--surface);border-radius:16px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-weight:bold;z-index:50;transition:transform .25s;border-left:8px solid var(--blue)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.good{border-color:var(--green)}
.toast.bad{border-color:var(--red)}

/* dialog */
.chat{display:flex;flex-direction:column;gap:10px;margin:10px 0 16px}
.bub{max-width:86%;padding:12px 14px;border-radius:18px;line-height:1.35;box-shadow:var(--shadow);animation:pop .25s}
.bub.npc{background:var(--surface);align-self:flex-start;border-bottom-left-radius:4px}
.bub.me{background:var(--blue);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.bub .who{font-size:12px;color:var(--muted);font-weight:bold;margin-bottom:3px}
.bub .row{display:flex;gap:8px;align-items:flex-start}
.bub .av{font-size:28px;line-height:1}
.bub .mini{margin-left:6px;font-size:16px;vertical-align:middle}
.narr{align-self:center;text-align:center;background:var(--surface2);border-radius:18px;padding:14px 16px;max-width:92%;animation:pop .25s}
.narr .av{font-size:44px}
.note{align-self:center;background:var(--yellow);color:#262A2D;border-radius:999px;padding:6px 14px;font-weight:bold;font-size:14px}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}

/* learn */
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;margin:8px 0 14px}
.seg button{flex:1;padding:10px;border-radius:10px;font-weight:bold;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.phr{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:12px 12px 12px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
.phr .tx{flex:1}
.phr .en{font-weight:bold}
.phr .czt{color:var(--muted);font-size:14px;margin-top:2px}
.phr .sp{width:40px;height:40px;border-radius:50%;background:var(--surface2);font-size:18px;flex-shrink:0}
.ttl{font-weight:bold;margin:18px 0 8px;color:var(--blue);text-transform:uppercase;font-size:13px;letter-spacing:.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 .phr{margin:0;padding:10px}
.flash{perspective:1000px;margin:10px 0 18px}
.flash .card{position:relative;height:250px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.flash .card.flip{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;box-shadow:var(--shadow)}
.flash .front{background:var(--surface)}
.flash .back{background:var(--blue);color:#fff;transform:rotateY(180deg)}
.flash .face .big{font-size:26px;font-weight:bold}
.flash .face .hint{font-size:13px;opacity:.7;margin-top:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row2 .bigbtn{width:100%;margin:0}

/* memory */
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.mcard{aspect-ratio:1/1;border-radius:16px;background:var(--blue);color:#fff;font-weight:bold;font-size:17px;display:flex;align-items:center;justify-content:center;flex-direction:column;box-shadow:0 4px 0 #1E7FAE;transition:transform .2s,background .2s;padding:4px}
.mcard.hidden{font-size:30px}
.mcard.open{background:var(--surface);color:var(--text);box-shadow:0 4px 0 var(--line);border:3px solid var(--blue)}
.mcard.done{background:rgba(104,187,138,.2);color:var(--text);border:3px solid var(--green);box-shadow:none}
.mcard .small{font-size:11px;font-weight:normal;color:var(--muted);margin-top:3px}

/* worm */
.wormhud{display:flex;align-items:center;justify-content:space-between;margin:8px 0}
.target{background:var(--yellow);color:#262A2D;border-radius:999px;padding:8px 14px;font-weight:bold}
canvas.worm{width:100%;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);touch-action:none;display:block}
.dpad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,56px);gap:8px;justify-content:center;margin-top:14px}
.dpad button{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);font-size:26px}
.dpad button:active{transform:translateY(2px)}

/* order */
.answer{min-height:96px;background:var(--surface);border-radius:16px;border:3px dashed var(--line);padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;margin:12px 0}
.answer.good{border-color:var(--green);border-style:solid}
.answer.bad{border-color:var(--red);animation:shake .35s}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:bold;font-size:17px;box-shadow:0 3px 0 var(--line)}
.tile.used{visibility:hidden}
.answer .tile{background:var(--surface2)}

/* maze */
.road{position:relative;height:110px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);margin:12px 0;overflow:hidden}
.road .strip{position:absolute;left:0;right:0;top:66px;height:22px;background:#9AA3A8}
.road .strip::after{content:"";position:absolute;left:0;right:0;top:10px;border-top:2px dashed #fff}
.road .lm{position:absolute;top:8px;font-size:22px;transform:translateX(-50%)}
.road .me{position:absolute;top:40px;width:46px;transform:translateX(-50%);transition:left .5s;z-index:2}
.road .goal{position:absolute;right:6px;top:30px;font-size:38px}
.dirs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dirs .opt{font-size:30px;padding:10px;min-height:76px}
.dirs .opt .small{font-size:12px}

/* cat scenes */
.scene{position:relative;width:220px;height:150px;margin:0 auto}
.scene .o{position:absolute;line-height:1}
.table{position:absolute;left:60px;top:70px;width:100px;height:56px}
.table::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:#B07A4A;border-radius:4px}
.table::after{content:"";position:absolute;left:8px;right:8px;top:10px;height:46px;border-left:8px solid #8A5A32;border-right:8px solid #8A5A32}
.box{position:absolute;width:64px;height:54px;background:#D9A55B;border:3px solid #9C6B2C;border-radius:6px}

/* waiter */
.palette{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.palette .opt{min-height:72px}
.palette .opt.sel{border-color:var(--blue);background:rgba(53,167,223,.15)}
.served{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:36px;font-size:28px;margin-top:8px}

/* speak */
.mic{width:110px;height:110px;border-radius:50%;background:var(--red);color:#fff;font-size:46px;display:flex;align-items:center;justify-content:center;margin:18px auto 8px;box-shadow:0 5px 0 #A9433C}
.mic.on{animation:pulse2 1.1s infinite}
@keyframes pulse2{0%{box-shadow:0 0 0 0 rgba(224,100,92,.6)}70%{box-shadow:0 0 0 22px rgba(224,100,92,0)}100%{box-shadow:0 0 0 0 rgba(224,100,92,0)}}
.heard{text-align:center;color:var(--muted);min-height:24px;margin:6px 0}
.reveal{font-size:22px;font-weight:bold;text-align:center;margin:10px 0;color:var(--blue)}
.smallbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.smallbtns button{background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:10px 14px;font-weight:bold}
.smallbtns .say{background:var(--blue);color:#fff}
.smallbtns .say.slow{background:var(--surface2);color:var(--text)}

/* results */
.result{text-align:center;padding:30px 18px}
.result .st{font-size:56px;letter-spacing:4px}
.result .st span{display:inline-block;animation:starpop .4s both}
.result .st span.off{filter:grayscale(1);opacity:.3}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
.result .pts{font-size:46px;font-weight:bold;margin:8px 0 0}
.result .lbl{color:var(--muted)}
.record{display:inline-block;background:var(--yellow);color:#262A2D;border-radius:999px;padding:6px 14px;font-weight:bold;margin-top:10px}

/* score card */
.scorecard{margin:12px 18px;border-radius:24px;padding:24px;background:linear-gradient(150deg,var(--blue),#2A86B8);color:#fff;box-shadow:var(--shadow);text-align:center;position:relative;overflow:hidden}
.scorecard .logo-badge{display:inline-flex;margin-bottom:10px}
.scorecard .nm{font-size:22px;font-weight:bold}
.scorecard .total{font-size:64px;font-weight:bold;line-height:1.1;margin:6px 0}
.scorecard .row{display:flex;justify-content:space-around;margin-top:12px;font-weight:bold}
.scorecard .row small{display:block;font-weight:normal;opacity:.85}
.lvlist{margin:6px 18px 30px}
.lvrow{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
input.txt{width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--text);font-size:17px;font-family:Arial}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:20px 18px 30px;max-height:90vh;overflow:auto;animation:up .25s}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet h3{margin:0 0 10px}
.sheet .lab{font-weight:bold;margin:16px 0 6px}
.danger{color:var(--red);font-weight:bold;padding:12px 0}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:10px 0 30px}

/* confetti */
.conf{position:fixed;top:-20px;width:10px;height:14px;z-index:70;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.soonbox{text-align:center;padding:40px 20px}
.soonbox .big{font-size:70px}
</style>
</head>
<body>

/* QUIZ (timed or not) */
ENGINES.quiz = function (body, act, L, api) {
  const g = GENS[act.gen](act);
  const timed = !!act.timed; let left = act.timed || 0, pts = 0, correct = 0, done = 0, streak = 0, firstTries = 0, timer = null, over = false;
  const n = timed ? 0 : g.count;
  const wrap = el("div"); body.append(wrap);
  function end() {
    if (over) return; over = true; clearInterval(timer);
    if (timed) api.finish(pts, correct >= act.target ? 3 : correct >= act.target * .7 ? 2 : correct >= act.target * .4 ? 1 : 0);
    else api.finish(pts, starsFromRatio(pts / (n * 100)));
  }
  if (timed) {
    api.timer(left, act.timed); api.hud("0");
    timer = setInterval(() => { left--; api.timer(left, act.timed); if (left <= 5 && left > 0) sfx("tick"); if (left <= 0) end(); }, 1000);
  }
  function next() {
    if (over) return;
    if (!timed && done >= n) { end(); return; }
    if (!timed) api.progress(done / n);
    const it = g.next(); let tries = 0;
    const optsBox = el("div", { class: "opts" + (g.list ? " list" : ""), style: it.cols ? "grid-template-columns:repeat(3,1fr)" : "" });
    const prompt = el("div", { class: "prompt" }, ...it.prompt, it.say ? sayBtns(it.say) : null);
    it.options.forEach(o => {
      const b = el("button", { class: "opt" }, o.node);
      b.onclick = () => {
        if (over || b.disabled) return;
        if (o.key === it.answer) {
          b.classList.add("good"); [...optsBox.children].forEach(x => x.disabled = true);
          if (timed) { streak++; correct++; pts += 100 + Math.min(streak, 10) * 10; api.hud(String(pts)); }
          else { const add = tries === 0 ? 100 : 50; pts += add; if (!tries) firstTries++; }
          sfx("good");
          const extra = it.after ? it.after(o.key) : "";
          toast((extra ? extra + "  " : "") + (it.afterText ? "✅ " + it.afterText : pick(GOOD)), "good", timed ? 700 : 1400);
          if (it.sayAfter) speak(it.sayAfter);
          done++; setTimeout(next, timed ? 450 : (it.sayAfter || it.afterText ? 1300 : 800));
        } else {
          tries++; b.classList.add("bad"); b.disabled = true; sfx("bad");
          const extra = it.after ? it.after(o.key) : "";

        }
      };
      optsBox.append(b);
    });
    wrap.innerHTML = ""; wrap.append(prompt, optsBox);
    if (it.say) setTimeout(() => speak(it.say), 200);
  }
  next();
  return () => clearInterval(timer);
};

          if (bestS >= 0.7) success(hinted ? 60 : tries ? 70 : 100);
          else {
            tries++; sfx("bad"); toast(bestS >= 0.4 ? "Skoro! Poslechni si to a zkus znovu 👂" : "Hmm, tomu jsem nerozuměl(a) 🤔 Zkus to znovu.", "bad", 1800);
            reveal.textContent = it.en; speak(it.say);
            if (tries >= 3) { after.innerHTML = ""; after.append(el("button", { onclick: () => success(40) }, "✓ Řekl(a) jsem to dobře"), el("button", { onclick: () => next(0) }, "Přeskočit ⏭")); }
          }
        };
        rec.onerror = e => {
          mic.classList.remove("on");
          if (e.error === "not-allowed" || e.error === "service-not-allowed" || e.error === "audio-capture") {
            canListen = false; toast("Mikrofon tu nejde. Řekni to nahlas a ohodnoť se sám/sama 🙂", "", 3000); selfMode();
          } else { heard.textContent = "Nic jsem neslyšel(a). Ťukni a mluv 🎤"; }
        };
        rec.onend = () => { mic.classList.remove("on"); if (!got && heard.textContent.startsWith("Poslouchám")) heard.textContent = "Nic jsem neslyšel(a). Ťukni a mluv 🎤"; };
        rec.start();
      } catch (err) { canListen = false; selfMode(); }
    };
    wrap.innerHTML = "";
    wrap.append(el("div", { class: "prompt" }, el("div", { class: "qs" }, "Řekni anglicky:"), el("div", { class: "q" }, it.cz)),
      mic, micLbl, heard, reveal, after,
      el("div", { class: "smallbtns" }, hint));
    if (!canListen) selfMode();
  }
  step();
};

applyTheme();
go(homeScreen);
</script>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
